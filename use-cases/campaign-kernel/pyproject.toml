[project]
name = "campaign-kernel"
version = "0.1.0"
description = "Agent Kernel event campaign production agent for Telegram-driven flyer and caption workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[api,cli,openai,telegram]>=0.6.1",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.6.1",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]
